monitor = , 1920x1080@60, 0x0, 1

animations {
    enabled = false
}

decoration {
    blur {
        enabled = false
    }
    shadow {
        enabled = false
    }
}

misc {
    disable_hyprland_logo = true
    disable_splash_rendering = true
}

ecosystem {
    no_update_news = true
    no_donation_nag = true
}

windowrule = match:class .*, float on

exec-once = sh -c 'printf %s "$DISPLAY" > "$RUSHLINE_DESKTOP_DISPLAY_FILE"'
