packages:
  - apps/*
  - packages/*

allowBuilds:
  esbuild: true
  unrs-resolver: true
  workerd: true
minimumReleaseAgeExclude:
  - "@vitest/mocker@5.0.0"
  - "@vitest/spy@5.0.0"
  - ultracite@7.10.8
  - vitest@5.0.0
  - effect@4.0.0
  - "@effect/platform-node@4.0.0"
  - "@effect/platform-node-shared@4.0.0"
  - "@tanstack/react-router@1.170.41"
  - "@tanstack/react-start-client@1.168.39"
  - "@tanstack/react-start-rsc@0.1.59"
  - "@tanstack/react-start-server@1.167.46"
  - "@tanstack/react-start@1.168.60"
  - "@tanstack/router-core@1.171.34"
  - "@tanstack/router-generator@1.167.40"
  - "@tanstack/router-plugin@1.168.42"
  - "@tanstack/start-client-core@1.170.34"
  - "@tanstack/start-plugin-core@1.171.49"
  - "@tanstack/start-server-core@1.169.39"
  - "@tanstack/start-storage-context@1.167.36"
  - vite@8.3.2

# Alchemy is installed from its preview registry (commit e354a455 of main) until an
# npm beta supports stable Effect 4.0.0. Its sibling packages resolve to
# content-addressed pkg.alchemy.run tarballs, which pnpm treats as exotic
# subdependencies. Restore the default (true) when Alchemy ships to npm.
blockExoticSubdeps: false
