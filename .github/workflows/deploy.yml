name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-prod
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  prod:
    name: prod
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_ACCOUNT_ID: 6979943b697a28951d44b9bcbcf61b42
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: state store credentials
        env:
          ALCHEMY_STATE_STORE: ${{ secrets.ALCHEMY_STATE_STORE }}
        run: |
          echo "ALCHEMY_HOME=$RUNNER_TEMP/alchemy" >> "$GITHUB_ENV"
          ALCHEMY_HOME="$RUNNER_TEMP/alchemy"
          mkdir -p "$ALCHEMY_HOME/credentials/default"
          printf '%s' "$ALCHEMY_STATE_STORE" > "$ALCHEMY_HOME/credentials/default/cloudflare-state-store.json"
      - run: pnpm exec alchemy deploy --stage prod --no-input --yes
      - name: serves the game
        run: curl --fail --silent --show-error --output /dev/null https://rushline.amartya-faceless.workers.dev/
      - name: serves every manifest key
        run: pnpm art:pull
