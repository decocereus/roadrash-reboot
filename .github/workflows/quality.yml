name: Quality

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  checks:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Oxlint
            command: bun run lint
          - name: Format
            command: bun run format:check
          - name: Ultracite
            command: bun run lint:style
          - name: Typecheck
            command: bun run typecheck
          - name: Unit tests
            command: bun run test
          - name: Build
            command: bun run build
          - name: Architecture
            command: bun run architecture
          - name: React Doctor
            command: bun run doctor

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.5

      - run: bun install --frozen-lockfile
      - run: ${{ matrix.command }}

  browser-smoke:
    name: Playwright smoke
    if: hashFiles('e2e/**/*', 'playwright.config.*') != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.5
      - run: bun install --frozen-lockfile
      - run: bunx playwright install --with-deps chromium
      - run: bun run test:e2e
