name: Quality

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  static:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: node scripts/verify.ts static
      - run: pnpm build

  tests:
    name: tests (${{ matrix.project }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        project: [police, "!police"]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/cache@v4
        with:
          path: ~/.cache/rushline/art
          key: art-${{ hashFiles('apps/web/src/assets/art.json') }}
          restore-keys: art-
      - run: pnpm test --project '${{ matrix.project }}'

  replay:
    name: replay (${{ matrix.engine }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        engine: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - id: engine
        run: |
          version=$(node -p 'require(require.resolve("playwright/package.json", { paths: ["tools/replay"] })).version')
          if [ -z "$version" ]; then
            echo "The replay workspace reported no Playwright version." >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "week=$(date +%G-W%V)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        id: browsers
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.engine.outputs.version }}-${{ matrix.engine }}
      # Ubuntu's Azure mirror sometimes serves at 45 kB/s, and WebKit's 139 MB of
      # packages would then take 51 minutes. With last week's packages restored,
      # apt fetches only what changed.
      - run: |
          mkdir -p ~/apt-archives/partial
          echo "Dir::Cache::Archives \"$HOME/apt-archives\";" | sudo tee /etc/apt/apt.conf.d/99-keep-archives
      - uses: actions/cache@v4
        with:
          path: ~/apt-archives/*.deb
          key: apt-${{ runner.os }}-${{ matrix.engine }}-${{ steps.engine.outputs.week }}
          restore-keys: apt-${{ runner.os }}-${{ matrix.engine }}-
      - run: pnpm --filter @racer/replay exec playwright install --with-deps ${{ matrix.engine }}
        if: steps.browsers.outputs.cache-hit != 'true'
      - run: pnpm --filter @racer/replay exec playwright install-deps ${{ matrix.engine }}
        if: steps.browsers.outputs.cache-hit == 'true'
      - run: pnpm replay:engines --engine ${{ matrix.engine }}

  perf:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/cache@v4
        with:
          path: ~/.cache/rushline/art
          key: art-${{ hashFiles('apps/web/src/assets/art.json') }}
          restore-keys: art-
      - run: pnpm art:pull
      - run: pnpm perf
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: perf-results
          path: tools/perf/results
          if-no-files-found: error
